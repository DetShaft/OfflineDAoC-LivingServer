# Builds the Living Server Setup exe and tests it on Windows: pictures of every page, then a real install of
# Offline DAoC from Living Server's copy of shadowofze's releases and every path Setup takes (tools/installer/test-installer.ps1).
# Beta 1.1.2: also which package Setup installs (a newer one from GitHub, checked by its digest), and the launcher's
# update path end to end on a fake game folder (tools/installer/test-launcher-update.ps1).
# Beta 1.1.11: the releases come from this fork's published releases (tools/release/pick_releases.py), never fixed tags.
name: installer

on:
  push:
    paths:
      - 'tools/installer/**'
      - 'source/tools/OfflineDaoc.Launcher/Updates/**'
      - 'source/tools/OfflineDaoc.Launcher/MainForm.Updates.cs'
      - 'tools/release/pick_releases.py'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
    inputs:
      package_release:
        description: "Living Server release tag whose package Setup embeds (empty: the newest published release)"
        default: ""
      e2e:
        description: "Run the real-download end-to-end tests (about 30-60 minutes)"
        type: boolean
        default: true
  # The release workflow (release.yml) builds and tests a published release's Setup with these same jobs.
  workflow_call:
    inputs:
      package_release:
        description: "Living Server release tag whose package Setup embeds"
        type: string
        required: true
      e2e:
        description: "Run the real-download end-to-end tests"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Which published releases to use: the package Setup embeds (the input, or the newest release) and the launcher-update
  # pair (the release before it, then it). Only this fork's published releases count; they start at v1.1.4-beta.
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.pick.outputs.package }}
      from: ${{ steps.pick.outputs.from }}
      to: ${{ steps.pick.outputs.to }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the releases
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package_release }}
        run: python3 tools/release/pick_releases.py --package "$PACKAGE"

  build:
    needs: releases
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Setup
        shell: bash
        run: python tools/installer/build.py --release "${{ needs.releases.outputs.package }}"
      - name: Pictures of every page (100 % and 150 %)
        shell: pwsh
        run: |
          $exe = Get-ChildItem tools/installer/dist/*.exe | Select-Object -First 1
          foreach ($s in '1', '1.5') {
            $p = Start-Process $exe.FullName -ArgumentList '--screenshots', "tools/installer/shots/scale-$s", '--scale', $s, '--log', "tools/installer/shots/scale-$s.log" -Wait -PassThru
            Write-Host "scale $s exit $($p.ExitCode)"
            Get-Content "tools/installer/shots/scale-$s.log" | Select-Object -Last 4
          }
          Get-ChildItem -Recurse tools/installer/shots/*.png | ForEach-Object { "$($_.Directory.Name)/$($_.Name)  $($_.Length)" }
      - uses: actions/upload-artifact@v4
        with:
          name: LivingServer-Setup
          path: |
            tools/installer/dist/*.exe
            tools/installer/payload/LivingServer.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/installer/shots/
          if-no-files-found: warn

  # Which package Setup installs (no game needed): GitHub's newest release when it is newer than the embedded one,
  # checked by its SHA-256 digest; the embedded one with --no-update or when the digest is wrong or missing.
  setup-newest:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingServer-Setup
          path: setup
      - name: Newest release, --no-update, wrong and missing digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem setup -Recurse -Filter *.exe | Select-Object -First 1
          $pkg = Get-ChildItem setup -Recurse -Filter LivingServer.zip | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& 'tools/installer/test-installer.ps1' -Exe '$($exe.FullName)' -Package '$($pkg.FullName)' -Work 'C:\lsnewest' -Scenario newest; exit `$LASTEXITCODE"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-newest-logs
          path: C:\lsnewest\logs\
          if-no-files-found: warn

  # The launcher's update path (GET UPDATE without the window): the release before the package Setup embeds is installed
  # on a fake 0.37 game, then the launcher built from this commit applies that package's release file with
  # --apply-update, INSTALL.cmd runs after it closes, and ROLLBACK.cmd undoes it. About two minutes, no game download.
  launcher-update:
    needs: releases
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the launcher
        run: dotnet build source/tools/OfflineDaoc.Launcher/OfflineDaoc.Launcher.csproj -c Release -p:SourceRevisionId=${{ github.sha }}
      - name: Update ${{ needs.releases.outputs.from }} to ${{ needs.releases.outputs.to }} through the launcher, then roll back
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/installer/test-launcher-update.ps1 -Launcher source/tools/OfflineDaoc.Launcher/bin/Release/net10.0-windows/OfflineDAoC.exe -Work C:\lsupdate -From "${{ needs.releases.outputs.from }}" -To "${{ needs.releases.outputs.to }}"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-update-logs
          path: C:\lsupdate\logs\
          if-no-files-found: warn

  e2e:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.e2e }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingServer-Setup
          path: setup
      - name: Real install, re-run, remove, reinstall, forced replace, 0.36 update
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup -Recurse -Filter *.exe | Select-Object -First 1
          $pkg = Get-ChildItem setup -Recurse -Filter LivingServer.zip | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/installer/test-installer.ps1 -Exe $exe.FullName -Package $pkg.FullName -Work C:\lstest
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: C:\lstest\logs\
          if-no-files-found: warn

  # The rest run on the runners' larger second drive (D:, about 145 GB free), each on its own machine.
  e2e-more:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.e2e }}
    runs-on: windows-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            scenarios: client,smoke
          - name: resume
            scenarios: resume,netfx,smoke
          # "import" is not run since 2026-11-13: it needs the 0.35b release files, which Living Server's copy of
          # shadowofze's releases does not hold (his repository went offline).
          - name: freshcopy
            scenarios: freshcopy
          - name: ui
            scenarios: ui
    name: e2e-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LivingServer-Setup
          path: setup
      - name: ${{ matrix.scenarios }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem setup -Recurse -Filter *.exe | Select-Object -First 1
          $pkg = Get-ChildItem setup -Recurse -Filter LivingServer.zip | Select-Object -First 1
          $list = '${{ matrix.scenarios }}'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "& 'tools/installer/test-installer.ps1' -Exe '$($exe.FullName)' -Package '$($pkg.FullName)' -Work 'D:\lstest' -Shots 'D:\lstest\shots' -Scenario $list; exit `$LASTEXITCODE"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.name }}-logs
          path: |
            D:\lstest\logs\
            D:\lstest\shots\
          if-no-files-found: warn
