# Runs only the bot AI simulation scenarios (UT_BotSim, #166) on any branch, on demand. The same scenarios also run in
# build-and-test on every push. See docs/BOT-AI-SIMULATION.md. Results are tests only, never in-game evidence.
name: bot-sim

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario name to run (blank: all). Example: leader-mezzed"
        required: false
        default: ""
      strict:
        description: "Fail when the live rules miss an expectation"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create local server config (build only needs it to exist)
        shell: bash
        run: cp source/server/CoreServer/config/serverconfig.example.xml source/server/CoreServer/config/serverconfig.xml
      - name: Build tests
        run: dotnet build source/server/Tests/Tests.csproj -c Release
      - name: Run the scenarios
        shell: bash
        env:
          BOT_SIM_DIR: ${{ github.workspace }}/bot-sim
          BOT_SIM_STRICT: ${{ inputs.strict && '1' || '0' }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          filter="FullyQualifiedName~UT_BotSim"
          if [ -n "$SCENARIO" ]; then filter="FullyQualifiedName~UT_BotSim&Name~$SCENARIO"; fi
          dotnet test source/server/Tests/Tests.csproj -c Release --no-build --filter "$filter" --logger "console;verbosity=normal"
      - name: Summarize
        if: always()
        shell: bash
        run: bash tools/bot-sim/summarize.sh bot-sim
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-sim
          path: bot-sim/
          if-no-files-found: warn
